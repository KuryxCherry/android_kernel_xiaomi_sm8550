name: Build Full Xiaomi SM8550 Kernel + Modules

on:
  workflow_dispatch:
    inputs:
      device:
        description: "目标设备"
        required: true
        default: "socrates"
        type: choice
        options:
          - socrates
          - fuxi
          - nuwa
          - vermeer
      enable_lto:
        description: "Clang LTO 模式（推荐 thin）"
        required: false
        default: "thin"
        type: choice
        options:
          - thin
          - none
      default_iosched:
        description: "默认开机 I/O 调度器（无损指定，保留全部调度器可热切）"
        required: false
        default: "ssg"
        type: choice
        options:
          - ssg
          - adios
          - bfq
          - kyber
          - mq-deadline
      default_read_ahead_kb:
        description: "默认块设备预读大小（KiB，无损指定，开机后可自由调整）"
        required: false
        default: "128"
        type: choice
        options:
          - "64"
          - "128"
          - "256"
          - "512"
      ksu_variant:
        description: "Root 方案（可选）"
        required: false
        default: "none"
        type: choice
        options:
          - none
          - kernelsu-next
          - kernelsu
      modules_repo:
        description: "外置驱动仓库（owner/repo）"
        required: false
        default: "KuryxCherry/android_kernel_xiaomi_sm8550-modules"
        type: string
      modules_ref:
        description: "外置驱动分支或 Tag"
        required: false
        default: "lineage-24.0"
        type: string
      upload_release:
        description: "发布产物到 GitHub Releases"
        required: false
        default: false
        type: boolean
      export_raw_images:
        description: "额外导出裸 Image 和 vendor_dlkm.img（默认关闭，避免与 AK3 刷入包重复）"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CLANG_VERSION: r596125
  CLANG_URL: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/mirror-goog-main-llvm-toolchain-source/clang-r596125.tar.gz
  ANYKERNEL_REPO: https://github.com/osm0sis/AnyKernel3.git
  DEVICE_COMMON_REPO: https://github.com/LineageOS/android_device_xiaomi_sm8550-common.git
  TARGET_BOARD_PLATFORM: kalama
  CCACHE_COMPRESS: "1"
  CCACHE_COMPRESSLEVEL: "6"
  CCACHE_SLOPPINESS: "time_macros,file_macro"
  CCACHE_NOHASHDIR: "1"

jobs:
  build-full:
    name: Full Build SM8550 (${{ inputs.device || 'socrates' }} / ${{ inputs.enable_lto || 'thin' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: 检查并按需释放 Runner 磁盘空间
        run: |
          AVAIL_GB=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          echo "Root filesystem available: ${AVAIL_GB}G"
          if [ "${AVAIL_GB:-0}" -lt 35 ]; then
            echo "Available space < 35G, cleaning preinstalled SDKs..."
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          else
            echo "Disk space sufficient (${AVAIL_GB}G >= 35G), skipping slow cleanup."
          fi
          df -h /

      - name: 安装编译与镜像打包依赖（含 pahole 1.25、erofs-utils）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl device-tree-compiler \
            dwarves erofs-utils flex git kmod libelf-dev libncurses-dev libssl-dev \
            lz4 python3 rsync tar unzip wget xz-utils zip zstd
          pahole --version
          mkfs.erofs --help | head -n 1

      - name: 拉取主内核源码（kernel/xiaomi/sm8550）
        uses: actions/checkout@v4
        with:
          path: kernel/xiaomi/sm8550
          fetch-depth: 1

      - name: 拉取外置驱动源码（kernel/xiaomi/sm8550-modules）
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.modules_repo || 'KuryxCherry/android_kernel_xiaomi_sm8550-modules' }}
          ref: ${{ inputs.modules_ref || 'lineage-24.0' }}
          path: kernel/xiaomi/sm8550-modules
          fetch-depth: 1

      - name: 拉取设备模块加载清单（device/xiaomi/sm8550-common）
        run: |
          git clone --depth=1 -b lineage-24.0 "${{ env.DEVICE_COMMON_REPO }}" device/xiaomi/sm8550-common

      - name: 解析构建参数
        id: meta
        run: |
          DEVICE="${{ inputs.device || 'socrates' }}"
          LTO_MODE="${{ inputs.enable_lto || 'thin' }}"
          KSU_VARIANT="${{ inputs.ksu_variant || 'none' }}"
          DEFAULT_IOSCHED="${{ inputs.default_iosched || 'ssg' }}"
          DEFAULT_RA_KB="${{ inputs.default_read_ahead_kb || '128' }}"
          SHORT_SHA=$(git -C kernel/xiaomi/sm8550 rev-parse --short HEAD)
          MOD_SHA=$(git -C kernel/xiaomi/sm8550-modules rev-parse --short HEAD)
          BUILD_DATE=$(date +%Y%m%d-%H%M)

          {
            echo "device=${DEVICE}"
            echo "lto_mode=${LTO_MODE}"
            echo "ksu_variant=${KSU_VARIANT}"
            echo "default_iosched=${DEFAULT_IOSCHED}"
            echo "default_read_ahead_kb=${DEFAULT_RA_KB}"
            echo "short_sha=${SHORT_SHA}"
            echo "mod_sha=${MOD_SHA}"
            echo "build_date=${BUILD_DATE}"
          } >> "$GITHUB_OUTPUT"

      - name: 集成 KernelSU / KernelSU-Next（可选）
        if: ${{ steps.meta.outputs.ksu_variant != 'none' }}
        working-directory: kernel/xiaomi/sm8550
        run: |
          case "${{ steps.meta.outputs.ksu_variant }}" in
            kernelsu-next)
              curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -
              ;;
            kernelsu)
              curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
              ;;
          esac

      - name: 缓存 AOSP Clang 22.0.2 (r596125)
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/toolchain/clang
          key: aosp-clang-${{ env.CLANG_VERSION }}

      - name: 下载 AOSP Clang 22.0.2 (r596125)
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${{ github.workspace }}/toolchain/clang"
          curl -fSL "${{ env.CLANG_URL }}" | tar -xz -C "${{ github.workspace }}/toolchain/clang"

      - name: 缓存 ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-full-sm8550-${{ env.CLANG_VERSION }}-${{ steps.meta.outputs.device }}-${{ steps.meta.outputs.lto_mode }}-${{ steps.meta.outputs.ksu_variant }}-${{ github.sha }}
          restore-keys: |
            ccache-full-sm8550-${{ env.CLANG_VERSION }}-${{ steps.meta.outputs.device }}-${{ steps.meta.outputs.lto_mode }}-${{ steps.meta.outputs.ksu_variant }}-
            ccache-full-sm8550-${{ env.CLANG_VERSION }}-${{ steps.meta.outputs.device }}-${{ steps.meta.outputs.lto_mode }}-

      - name: 编译主内核 Image 与内置模块（in-tree modules）
        run: |
          set -euo pipefail
          WS="${{ github.workspace }}"
          KERNEL_SRC="${WS}/kernel/xiaomi/sm8550"
          KERNEL_OUT="${WS}/out/sm8550"
          MOD_STAGE="${WS}/out/modules_stage"
          mkdir -p "${KERNEL_OUT}" "${MOD_STAGE}"

          export PATH="${WS}/toolchain/clang/bin:${PATH}"
          export CCACHE_DIR="${HOME}/.cache/ccache"
          export KBUILD_BUILD_USER="github-actions"
          export KBUILD_BUILD_HOST="sm8550-ci"
          export TARGET_BOARD_PLATFORM="kalama"
          mkdir -p "${CCACHE_DIR}"
          clang --version
          ccache -M 4G
          ccache -z

          MAKE_ARGS=(
            O="${KERNEL_OUT}"
            ARCH=arm64
            SUBARCH=arm64
            CC="ccache clang"
            HOSTCC=clang
            HOSTCXX=clang++
            LLVM=1
            LLVM_IAS=1
            DEPMOD=depmod
            DTC_EXT="$(command -v dtc)"
          )

          cd "${KERNEL_SRC}"
          make -j"$(nproc)" "${MAKE_ARGS[@]}" gki_defconfig vendor/kalama_GKI.config "vendor/${{ steps.meta.outputs.device }}_GKI.config"

          case "${{ steps.meta.outputs.lto_mode }}" in
            thin) ./scripts/config --file "${KERNEL_OUT}/.config" -d LTO_NONE -d LTO_CLANG_FULL -e LTO_CLANG_THIN ;;
            none) ./scripts/config --file "${KERNEL_OUT}/.config" -d LTO_CLANG_THIN -d LTO_CLANG_FULL -e LTO_NONE ;;
          esac

          if [ "${{ steps.meta.outputs.ksu_variant }}" != "none" ]; then
            ./scripts/config --file "${KERNEL_OUT}/.config" -e KSU -e KPROBES -e OVERLAY_FS
          fi

          ./scripts/config --file "${KERNEL_OUT}/.config" --set-str DEFAULT_IOSCHED "${{ steps.meta.outputs.default_iosched }}"
          ./scripts/config --file "${KERNEL_OUT}/.config" --set-val DEFAULT_READ_AHEAD_KB "${{ steps.meta.outputs.default_read_ahead_kb }}"

          make -j"$(nproc)" "${MAKE_ARGS[@]}" olddefconfig
          grep -E '^(CONFIG_TCP_CONG_BBR3|CONFIG_DEFAULT_TCP_CONG|CONFIG_NET_SCH_DEFAULT|CONFIG_DEFAULT_FQ|CONFIG_DEFAULT_NET_SCH|CONFIG_LRU_GEN_ENABLED|CONFIG_RCU_LAZY|CONFIG_LTO_CLANG|# CONFIG_RCU_LAZY_DEFAULT_OFF|CONFIG_REKERNEL|CONFIG_ZRAM_DEF_COMP|CONFIG_DEFAULT_IOSCHED|CONFIG_DEFAULT_READ_AHEAD_KB)' "${KERNEL_OUT}/.config" || true

          make -j"$(nproc)" "${MAKE_ARGS[@]}" Image modules
          make -j"$(nproc)" "${MAKE_ARGS[@]}" INSTALL_MOD_PATH="${MOD_STAGE}" INSTALL_MOD_STRIP=1 modules_install

          echo "=== In-tree modules installed ==="
          find "${MOD_STAGE}" -name '*.ko' | wc -l

      - name: 编译并安装 24 套高通/NXP 外置驱动模块
        run: |
          set -euo pipefail
          WS="${{ github.workspace }}"
          KERNEL_SRC="${WS}/kernel/xiaomi/sm8550"
          EXT_ROOT="${WS}/kernel/xiaomi/sm8550-modules"
          KERNEL_OUT="${WS}/out/sm8550"
          MOD_STAGE="${WS}/out/modules_stage"

          export PATH="${WS}/toolchain/clang/bin:${PATH}"
          export CCACHE_DIR="${HOME}/.cache/ccache"
          export KBUILD_BUILD_USER="github-actions"
          export KBUILD_BUILD_HOST="sm8550-ci"
          export TARGET_BOARD_PLATFORM="kalama"

          EXT_MODULES=(
            "qcom/opensource/mmrm-driver"
            "qcom/opensource/mm-drivers/hw_fence"
            "qcom/opensource/mm-drivers/msm_ext_display"
            "qcom/opensource/mm-drivers/sync_fence"
            "qcom/opensource/audio-kernel"
            "qcom/opensource/camera-kernel"
            "qcom/opensource/dataipa/drivers/platform/msm"
            "qcom/opensource/datarmnet/core"
            "qcom/opensource/datarmnet-ext/aps"
            "qcom/opensource/datarmnet-ext/offload"
            "qcom/opensource/datarmnet-ext/shs"
            "qcom/opensource/datarmnet-ext/perf"
            "qcom/opensource/datarmnet-ext/perf_tether"
            "qcom/opensource/datarmnet-ext/sch"
            "qcom/opensource/datarmnet-ext/wlan"
            "qcom/opensource/securemsm-kernel"
            "qcom/opensource/display-drivers/msm"
            "qcom/opensource/eva-kernel"
            "qcom/opensource/video-driver"
            "qcom/opensource/graphics-kernel"
            "qcom/opensource/wlan/platform"
            "qcom/opensource/wlan/qcacld-3.0/.kiwi_v2"
            "qcom/opensource/bt-kernel"
            "nxp/opensource/driver"
          )

          COMMON_ARGS=(
            KERNEL_SRC="${KERNEL_SRC}"
            OUT_DIR="${KERNEL_OUT}"
            O="${KERNEL_OUT}"
            ARCH=arm64
            SUBARCH=arm64
            TARGET_BOARD_PLATFORM=kalama
            CC="ccache clang"
            HOSTCC=clang
            HOSTCXX=clang++
            LLVM=1
            LLVM_IAS=1
            DEPMOD=depmod
            DTC_EXT="$(command -v dtc)"
          )

          for MOD in "${EXT_MODULES[@]}"; do
            echo "================================================================"
            echo "[EXT-MOD] Building: ${MOD}"
            echo "================================================================"
            make -j"$(nproc)" -C "${EXT_ROOT}/${MOD}" M="../sm8550-modules/${MOD}" "${COMMON_ARGS[@]}"
            make -j"$(nproc)" -C "${EXT_ROOT}/${MOD}" M="../sm8550-modules/${MOD}" "${COMMON_ARGS[@]}" \
              INSTALL_MOD_PATH="${MOD_STAGE}" \
              INSTALL_MOD_STRIP=1 \
              KERNEL_UAPI_HEADERS_DIR="${KERNEL_OUT}" \
              modules_install
          done

          ccache -s | tee "${WS}/out/ccache_stats.txt"
          echo "=== Total .ko modules compiled (in-tree + external) ==="
          find "${MOD_STAGE}" -name '*.ko' | wc -l

      - name: 分拣模块、生成 EROFS vendor_dlkm.img 并打包三合一 AnyKernel3 刷入包
        id: package
        run: |
          set -euo pipefail
          WS="${{ github.workspace }}"
          KERNEL_OUT="${WS}/out/sm8550"
          MOD_STAGE="${WS}/out/modules_stage"
          COMMON_DIR="${WS}/device/xiaomi/sm8550-common"
          STAGE_IMG_DIR="${WS}/out/stage_images"
          DIST_DIR="${WS}/dist"
          DEVICE="${{ steps.meta.outputs.device }}"
          EXPORT_RAW="${{ inputs.export_raw_images == true && 'true' || 'false' }}"
          mkdir -p "${STAGE_IMG_DIR}" "${DIST_DIR}"

          KERNEL_VER=$(cat "${KERNEL_OUT}/include/config/kernel.release" 2>/dev/null || echo "5.15-sm8550")
          echo "kernel_release=${KERNEL_VER}" >> "$GITHUB_OUTPUT"

          cp "${KERNEL_OUT}/arch/arm64/boot/Image" "${STAGE_IMG_DIR}/Image"
          cp "${KERNEL_OUT}/.config" "${DIST_DIR}/defconfig_used"

          # Stage first_stage, recovery, and vendor_dlkm with full depmod resolution
          python3 - "${MOD_STAGE}" "${COMMON_DIR}" "${WS}/out/partitions" "${KERNEL_VER}" "${DEVICE}" "${DIST_DIR}/module_report.txt" <<'PYEOF'
          import os, sys, shutil, subprocess

          mod_stage, common_dir, out_parts, kver, device, report_path = sys.argv[1:7]
          kdir = os.path.join(mod_stage, "lib", "modules", kver)

          all_kos = {}
          for root, _, files in os.walk(kdir):
              for f in files:
                  if f.endswith(".ko"):
                      all_kos[f] = os.path.join(root, f)

          flat_root = os.path.join(out_parts, "_all_flat")
          flat_kdir = os.path.join(flat_root, "lib", "modules", kver)
          os.makedirs(flat_kdir, exist_ok=True)
          for name, path in all_kos.items():
              shutil.copy2(path, os.path.join(flat_kdir, name))
          for meta in ("modules.order", "modules.builtin", "modules.builtin.modinfo"):
              src_m = os.path.join(kdir, meta)
              if os.path.exists(src_m):
                  shutil.copy2(src_m, os.path.join(flat_kdir, meta))
          subprocess.run(["depmod", "-b", flat_root, kver], check=True)

          deps = {}
          with open(os.path.join(flat_kdir, "modules.dep")) as fh:
              for line in fh:
                  line = line.strip()
                  if not line or ":" not in line:
                      continue
                  mod, dlist = line.split(":", 1)
                  deps[os.path.basename(mod.strip())] = [os.path.basename(d.strip()) for d in dlist.split() if d.strip()]

          def read_list(path):
              res = []
              with open(path) as fh:
                  for l in fh:
                      l = l.strip()
                      if l and not l.startswith("#"):
                          res.append(os.path.basename(l))
              return res

          first_stage_load = read_list(os.path.join(common_dir, "modules.load.first_stage"))
          recovery_load = read_list(os.path.join(common_dir, "modules.load.recovery"))
          vendor_dlkm_load = read_list(os.path.join(common_dir, "modules.load.vendor_dlkm"))

          device_dlkm_extras = {
              "socrates": ["wl2866d.ko", "xiaomi_touch.ko", "goodix_core.ko", "goodix_fod.ko"],
              "vermeer": ["wl2866d.ko", "wl2868c.ko", "xiaomi_touch.ko", "goodix_core.ko", "goodix_fod.ko"],
              "fuxi": ["xiaomi_touch.ko", "fts_touch_spi.ko", "goodix_fod.ko"],
              "nuwa": ["wl2866d.ko", "xiaomi_touch.ko", "fts_touch_spi.ko", "goodix_fod.ko"],
          }
          device_rec_extras = {
              "socrates": ["goodix_core.ko"],
              "vermeer": ["goodix_core.ko"],
              "fuxi": ["fts_touch_spi.ko"],
              "nuwa": ["fts_touch_spi.ko"],
          }
          for m in device_dlkm_extras.get(device, []):
              if m not in vendor_dlkm_load:
                  vendor_dlkm_load.append(m)
          for m in device_rec_extras.get(device, []):
              if m not in recovery_load:
                  recovery_load.append(m)

          def expand_with_deps(seed_list):
              selected = []
              seen = set()
              missing = []
              def visit(m):
                  if m in seen:
                      return
                  if m not in all_kos:
                      missing.append(m)
                      return
                  seen.add(m)
                  for d in deps.get(m, []):
                      visit(d)
                  selected.append(m)
              for m in seed_list:
                  visit(m)
              return selected, sorted(set(missing))

          fs_mods, fs_missing = expand_with_deps(first_stage_load)
          rec_mods, rec_missing = expand_with_deps(recovery_load)
          dlkm_mods, dlkm_missing = expand_with_deps(vendor_dlkm_load)

          def stage_partition(name, mods, load_order, dep_prefix):
              part_root = os.path.join(out_parts, name)
              part_kdir = os.path.join(part_root, "lib", "modules", kver)
              os.makedirs(part_kdir, exist_ok=True)
              for m in mods:
                  shutil.copy2(all_kos[m], os.path.join(part_kdir, m))
              with open(os.path.join(part_kdir, "modules.order"), "w") as fh:
                  for m in mods:
                      fh.write(m + "\n")
              for meta in ("modules.builtin", "modules.builtin.modinfo"):
                  src_m = os.path.join(kdir, meta)
                  if os.path.exists(src_m):
                      shutil.copy2(src_m, os.path.join(part_kdir, meta))
              subprocess.run(["depmod", "-b", part_root, kver], check=True)
              dep_p = os.path.join(part_kdir, "modules.dep")
              rewritten = []
              with open(dep_p) as fh:
                  for line in fh:
                      if ":" not in line:
                          continue
                      left, right = line.strip().split(":", 1)
                      l_out = dep_prefix + os.path.basename(left.strip())
                      r_items = [dep_prefix + os.path.basename(x) for x in right.split() if x.strip()]
                      rewritten.append(f"{l_out}: {' '.join(r_items)}".rstrip() + "\n")
              with open(dep_p, "w") as fh:
                  fh.writelines(rewritten)
              # Keep only the 4 runtime files Android modprobe uses
              for fn in list(os.listdir(part_kdir)):
                  if fn.endswith(".ko") or fn in ("modules.dep", "modules.alias", "modules.softdep"):
                      continue
                  os.remove(os.path.join(part_kdir, fn))
              with open(os.path.join(part_kdir, "modules.load"), "w") as fh:
                  for m in load_order:
                      if m in all_kos:
                          fh.write(m + "\n")
              return part_kdir

          stage_partition("first_stage", fs_mods, first_stage_load, "/lib/modules/")
          stage_partition("recovery", rec_mods, recovery_load, "/lib/modules/")
          stage_partition("vendor_dlkm", dlkm_mods, vendor_dlkm_load, "/vendor_dlkm/lib/modules/")

          report = [
              f"Kernel Release: {kver}",
              f"Device: {device}",
              f"Total compiled .ko files: {len(all_kos)}",
              f"vendor_boot first_stage: {len(fs_mods)} modules (missing: {len(fs_missing)})",
              f"vendor_boot recovery: {len(rec_mods)} modules (missing: {len(rec_missing)})",
              f"vendor_dlkm: {len(dlkm_mods)} modules (missing: {len(dlkm_missing)})",
          ]
          if fs_missing:
              report.append("Missing first_stage: " + ", ".join(fs_missing))
          if rec_missing:
              report.append("Missing recovery: " + ", ".join(rec_missing))
          if dlkm_missing:
              report.append("Missing vendor_dlkm: " + ", ".join(dlkm_missing))

          text = "\n".join(report) + "\n"
          print(text)
          with open(report_path, "w") as fh:
              fh.write(text)

          if fs_missing or dlkm_missing:
              sys.stderr.write("ERROR: Critical modules missing! Aborting package build.\n")
              sys.exit(1)
          PYEOF

          # Build SELinux-labeled EROFS vendor_dlkm.img (LZ4HC compressed)
          EROFS_SRC="${WS}/out/erofs_vendor_dlkm"
          rm -rf "${EROFS_SRC}"
          mkdir -p "${EROFS_SRC}/lib/modules" "${EROFS_SRC}/etc"
          cp -a "${WS}/out/partitions/vendor_dlkm/lib/modules/${KERNEL_VER}/." "${EROFS_SRC}/lib/modules/"
          chmod 755 "${EROFS_SRC}" "${EROFS_SRC}/lib" "${EROFS_SRC}/lib/modules" "${EROFS_SRC}/etc"
          chmod 644 "${EROFS_SRC}/lib/modules/"*

          case "${DEVICE}" in
            socrates) BRAND="Redmi"; MODEL="22127RK46C" ;;
            vermeer)  BRAND="Redmi"; MODEL="23113RKC6C" ;;
            fuxi)     BRAND="Xiaomi"; MODEL="2211133C" ;;
            nuwa)     BRAND="Xiaomi"; MODEL="2210132C" ;;
            *)        BRAND="Xiaomi"; MODEL="${DEVICE}" ;;
          esac
          cat <<EOF > "${EROFS_SRC}/etc/build.prop"
          ro.product.vendor_dlkm.brand=${BRAND}
          ro.product.vendor_dlkm.device=${DEVICE}
          ro.product.vendor_dlkm.manufacturer=Xiaomi
          ro.product.vendor_dlkm.model=${MODEL}
          ro.product.vendor_dlkm.name=${DEVICE}
          EOF
          touch "${EROFS_SRC}/etc/fs_config_dirs" "${EROFS_SRC}/etc/fs_config_files"
          chmod 644 "${EROFS_SRC}/etc/"*

          FC_FILE="${WS}/out/vendor_dlkm_file_contexts"
          cat <<'EOF' > "${FC_FILE}"
          /vendor_dlkm(/.*)?                  u:object_r:vendor_file:s0
          /vendor_dlkm/etc(/.*)?              u:object_r:vendor_configs_file:s0
          EOF

          mkfs.erofs -zlz4hc,9 \
            --mount-point=/vendor_dlkm \
            --file-contexts="${FC_FILE}" \
            --force-uid=0 --force-gid=0 \
            -T 1230768000 \
            "${STAGE_IMG_DIR}/vendor_dlkm.img" \
            "${EROFS_SRC}"

          DLKM_SIZE=$(wc -c < "${STAGE_IMG_DIR}/vendor_dlkm.img")
          echo "vendor_dlkm.img size: ${DLKM_SIZE} bytes" | tee -a "${DIST_DIR}/module_report.txt"

          # Pack unified 3-in-1 AnyKernel3 zip (boot + vendor_boot ramdisk modules + vendor_dlkm.img)
          git clone --depth=1 "${{ env.ANYKERNEL_REPO }}" "${WS}/AnyKernel3"
          cd "${WS}/AnyKernel3"
          rm -rf .git README.md
          cp "${STAGE_IMG_DIR}/Image" ./Image
          cp "${STAGE_IMG_DIR}/vendor_dlkm.img" ./vendor_dlkm.img
          mkdir -p ./ak3_modules/first_stage ./ak3_modules/recovery
          cp -a "${WS}/out/partitions/first_stage/lib/modules/${KERNEL_VER}/." ./ak3_modules/first_stage/
          cp -a "${WS}/out/partitions/recovery/lib/modules/${KERNEL_VER}/." ./ak3_modules/recovery/

          cat <<EOF > anykernel.sh
          ### AnyKernel3 Unified 3-in-1 Partition Flash Script
          ## Flashes: vendor_dlkm (EROFS image) + boot (Image) + vendor_boot (first_stage/recovery modules)

          properties() { '
          kernel.string=Xiaomi SM8550 Full Kernel (${DEVICE}) - ${KERNEL_VER}
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=${DEVICE}
          device.name2=
          device.name3=
          device.name4=
          device.name5=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; } # end properties
          EOF

          cat <<'EOF' >> anykernel.sh

          ### Initialize AnyKernel3 (device check & slot detection)
          BLOCK=boot;
          IS_SLOT_DEVICE=1;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          ### Phase 1/3: Flash vendor_dlkm.img FIRST (so any failure aborts before touching boot/vendor_boot)
          ui_print " " "Phase 1/3: Flashing vendor_dlkm.img...";
          DLKM_NAME="vendor_dlkm${SLOT}";

          find_dlkm_block() {
            local p f;
            for p in /dev/block/mapper /dev/block/by-name /dev/block/bootdevice/by-name; do
              for f in "$DLKM_NAME" vendor_dlkm; do
                if [ -e "$p/$f" ]; then
                  echo "$p/$f";
                  return 0;
                fi;
              done;
            done;
            if [ -x /system/bin/dmctl ]; then
              p=$(/system/bin/dmctl getpath "$DLKM_NAME" 2>/dev/null || true);
              if [ -n "$p" ] && [ -e "$p" ]; then
                echo "$p";
                return 0;
              fi;
            fi;
            return 1;
          }

          DLKM_BLK=$(find_dlkm_block || true);
          if [ -z "$DLKM_BLK" ] && [ -x "$BIN/lptools_static" ]; then
            "$BIN/lptools_static" map "$DLKM_NAME" 2>/dev/null || true;
            DLKM_BLK=$(find_dlkm_block || true);
          fi;
          if [ -z "$DLKM_BLK" ] && [ -x /system/bin/dmctl ]; then
            /system/bin/dmctl create-from-super /dev/block/by-name/super "$DLKM_NAME" 2>/dev/null || true;
            DLKM_BLK=$(find_dlkm_block || true);
          fi;
          if [ -z "$DLKM_BLK" ] && [ -x /system/bin/lpdump ] && [ -x /system/bin/dmctl ]; then
            parse_lpdump() {
              "$BIN/busybox" awk -v target="$DLKM_NAME" '
                $1 == "Name:" { in_part = ($2 == target) }
                in_part && $2 == ".." && $4 == "linear" && $5 == "super" {
                  cnt = $3 - $1 + 1;
                  printf "linear %s %s /dev/block/by-name/super %s ", $1, cnt, $6;
                }
              ';
            }
            DM_TARGETS=$(/system/bin/lpdump 2>/dev/null | parse_lpdump);
            if [ -z "$DM_TARGETS" ]; then
              case "$SLOT" in
                _a) DM_TARGETS=$(/system/bin/lpdump --slot=0 2>/dev/null | parse_lpdump) ;;
                _b) DM_TARGETS=$(/system/bin/lpdump --slot=1 2>/dev/null | parse_lpdump) ;;
              esac;
            fi;
            if [ -n "$DM_TARGETS" ]; then
              ui_print " " "  -> Mapping ${DLKM_NAME} directly from super metadata...";
              /system/bin/dmctl create "$DLKM_NAME" $DM_TARGETS 2>/dev/null || true;
              sleep 1;
              DLKM_BLK=$(find_dlkm_block || true);
            fi;
          fi;

          [ -n "$DLKM_BLK" ] || abort "vendor_dlkm partition (${DLKM_NAME}) could not be found or mapped! Boot/vendor_boot untouched. Aborting...";

          IMG_SZ=$(wc -c < "$AKHOME/vendor_dlkm.img");
          PART_SZ=$(blockdev --getsize64 "$DLKM_BLK" 2>/dev/null || /system/bin/blockdev --getsize64 "$DLKM_BLK" 2>/dev/null || wc -c < "$DLKM_BLK");
          ui_print " " "  -> Target: ${DLKM_BLK} (img=${IMG_SZ}B, part=${PART_SZ}B)";

          if [ "$IMG_SZ" -le "$PART_SZ" ]; then
            # Image fits inside existing partition: write in-place without risky lptools resize/unmap
            if [ -x "$BIN/httools_static" ] && [ ! "$NO_VBMETA_PARTITION_PATCH" ]; then
              AVB_PART=$("$BIN/httools_static" avb vendor_dlkm 2>/dev/null || true);
              AVB_FLAGS=$("$BIN/httools_static" disable-flags 2>/dev/null || true);
              if [ -n "$AVB_PART" ] && [ "$AVB_FLAGS" = "enabled" ]; then
                ui_print " " "  -> dm-verity detected! Patching ${AVB_PART}...";
                AVB_BLK="";
                for p in /dev/block/mapper /dev/block/by-name /dev/block/bootdevice/by-name; do
                  for f in "${AVB_PART}${SLOT}" "$AVB_PART"; do
                    if [ -e "$p/$f" ]; then AVB_BLK="$p/$f"; break 2; fi;
                  done;
                done;
                [ -n "$AVB_BLK" ] || abort "Could not locate ${AVB_PART} for AVB patch! Aborting...";
                (cd "$BIN" && ./httools_static patch vendor_dlkm "$AKHOME/vendor_dlkm.img" "$AVB_BLK") || abort "Failed to patch AVB on ${AVB_PART}! Aborting...";
              fi;
            fi;

            if grep -q ' /vendor_dlkm ' /proc/mounts 2>/dev/null; then
              "$BIN/httools_static" umount vendor_dlkm 2>/dev/null || umount /vendor_dlkm 2>/dev/null || umount -l /vendor_dlkm 2>/dev/null || true;
            fi;

            IS_RO=$(blockdev --getro "$DLKM_BLK" 2>/dev/null || /system/bin/blockdev --getro "$DLKM_BLK" 2>/dev/null || echo 1);
            blockdev --setrw "$DLKM_BLK" 2>/dev/null || /system/bin/blockdev --setrw "$DLKM_BLK" 2>/dev/null || true;
            dd if="$AKHOME/vendor_dlkm.img" of="$DLKM_BLK" bs=4096 conv=fsync || abort "Flashing vendor_dlkm.img failed! Aborting...";

            SRC_SHA=$(sha256sum "$AKHOME/vendor_dlkm.img" 2>/dev/null | awk '{print $1}');
            DST_SHA=$(head -c "$IMG_SZ" "$DLKM_BLK" 2>/dev/null | sha256sum 2>/dev/null | awk '{print $1}');
            if [ -n "$SRC_SHA" ] && [ -n "$DST_SHA" ] && [ "$SRC_SHA" != "$DST_SHA" ]; then
              abort "vendor_dlkm SHA256 verification failed! Aborting...";
            fi;
            ui_print " " "  -> vendor_dlkm flashed & verified (SHA256 OK).";

            if [ "$IS_RO" != "0" ]; then
              blockdev --setro "$DLKM_BLK" 2>/dev/null || /system/bin/blockdev --setro "$DLKM_BLK" 2>/dev/null || true;
            fi;
            rm -f "$AKHOME/vendor_dlkm.img";
            touch "$AKHOME/vendor_dlkm_flashed";
          else
            # Only fall back to ak3 dynamic resize if image actually exceeds current partition size
            flash_generic vendor_dlkm;
          fi;

          ### Phase 2/3: Flash GKI boot partition (Image only; ramdisk lives in init_boot)
          ui_print " " "Phase 2/3: Flashing boot Image...";
          split_boot;
          flash_boot;

          # Remove Image before vendor_boot phase so flash_boot will not inject kernel into vendor_boot
          rm -f "$AKHOME/Image";

          ### Phase 3/3: Update vendor_boot ramdisk modules & repack
          BLOCK=vendor_boot;
          IS_SLOT_DEVICE=1;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          ui_print " " "Phase 3/3: Updating vendor_boot ramdisk modules...";
          reset_ak;
          dump_boot;

          UPDATED_ANY=0;
          for moddir in "$RAMDISK/lib/modules" "$VENDORRD"/*/lib/modules; do
            [ -d "$moddir" ] || continue;
            UPDATED_ANY=1;
            MOD_CNT=$(wc -l < "$moddir/modules.load" 2>/dev/null || echo 0);
            case "$moddir" in
              *recovery*) SRC_DIR="$AKHOME/ak3_modules/recovery" ;;
              *)
                if [ "$MOD_CNT" -gt 200 ] 2>/dev/null; then
                  SRC_DIR="$AKHOME/ak3_modules/recovery";
                else
                  SRC_DIR="$AKHOME/ak3_modules/first_stage";
                fi;
                ;;
            esac;
            ui_print " " "  -> Updating $(basename "$(dirname "$(dirname "$moddir")")")/lib/modules ($(basename "$SRC_DIR"))";
            rm -f "$moddir"/*.ko "$moddir"/modules.*;
            cp -f "$SRC_DIR"/* "$moddir"/;
            set_perm_recursive 0 0 755 644 "$moddir";
          done;
          [ "$UPDATED_ANY" = 1 ] || abort "No lib/modules found inside vendor_boot! Aborting...";

          ui_print " " "  -> Repacking & flashing vendor_boot...";
          write_boot;
          EOF
          sh -n anykernel.sh
          chmod 644 anykernel.sh

          KSU_TAG=$([ "${{ steps.meta.outputs.ksu_variant }}" != "none" ] && echo "-${{ steps.meta.outputs.ksu_variant }}" || echo "")
          BASE_TAG="sm8550-${DEVICE}-${{ steps.meta.outputs.lto_mode }}${KSU_TAG}-${{ steps.meta.outputs.build_date }}-${{ steps.meta.outputs.short_sha }}"
          AK3_ZIP="AnyKernel3-full-${BASE_TAG}.zip"
          zip -r9 "${DIST_DIR}/${AK3_ZIP}" ./* -x "*.zip"

          if [ "${EXPORT_RAW}" = "true" ]; then
            cp "${STAGE_IMG_DIR}/Image" "${DIST_DIR}/Image"
            cp "${STAGE_IMG_DIR}/vendor_dlkm.img" "${DIST_DIR}/vendor_dlkm.img"
          fi

          (cd "${DIST_DIR}" && sha256sum ./* > /tmp/SHA256SUMS.txt)
          sed -i 's| \./| |' /tmp/SHA256SUMS.txt
          mv /tmp/SHA256SUMS.txt "${DIST_DIR}/SHA256SUMS.txt"
          ls -lh "${DIST_DIR}"

          AK3_SIZE_H=$(du -h "${DIST_DIR}/${AK3_ZIP}" | awk '{print $1}')
          AK3_SHA256=$(awk -v f="${AK3_ZIP}" '$2 == f {print $1}' "${DIST_DIR}/SHA256SUMS.txt")
          {
            echo "## Xiaomi SM8550 Full Kernel Build Summary"
            echo ""
            echo "| 项目 | 值 |"
            echo "| :--- | :--- |"
            echo "| **设备** | \`${DEVICE}\` |"
            echo "| **内核版本** | \`${KERNEL_VER}\` |"
            echo "| **主内核 / 外置模块提交** | \`${{ steps.meta.outputs.short_sha }}\` / \`${{ steps.meta.outputs.mod_sha }}\` |"
            echo "| **LTO / KernelSU** | \`${{ steps.meta.outputs.lto_mode }}\` / \`${{ steps.meta.outputs.ksu_variant }}\` |"
            echo "| **刷入包** | \`${AK3_ZIP}\` (${AK3_SIZE_H}) |"
            echo "| **SHA256** | \`${AK3_SHA256}\` |"
            echo ""
            echo "### 模块分拣报告"
            echo '```text'
            cat "${DIST_DIR}/module_report.txt"
            echo '```'
            if [ -f "${WS}/out/ccache_stats.txt" ]; then
              echo "### ccache 统计"
              echo '```text'
              cat "${WS}/out/ccache_stats.txt"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传构建产物（Artifact）
        uses: actions/upload-artifact@v4
        with:
          name: full-ak3-sm8550-${{ steps.meta.outputs.device }}-${{ steps.meta.outputs.lto_mode }}-${{ steps.meta.outputs.short_sha }}
          path: ${{ github.workspace }}/dist/*
          compression-level: 0
          retention-days: 14

      - name: 发布 GitHub Release（可选）
        if: inputs.upload_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: full-${{ steps.meta.outputs.device }}-${{ steps.meta.outputs.build_date }}
          name: "Xiaomi SM8550 Full Kernel (${{ steps.meta.outputs.device }}) - ${{ steps.package.outputs.kernel_release }}"
          body: |
            - **设备**: `${{ steps.meta.outputs.device }}`
            - **内核版本**: `${{ steps.package.outputs.kernel_release }}`
            - **主内核提交**: `${{ steps.meta.outputs.short_sha }}`
            - **外置驱动提交**: `${{ steps.meta.outputs.mod_sha }}`
            - **LTO 模式**: `${{ steps.meta.outputs.lto_mode }}`
            - **KernelSU**: `${{ steps.meta.outputs.ksu_variant }}`
            - **刷入说明**: Recovery 一键刷入 `AnyKernel3-full-*.zip`（同步写入 `boot` + `vendor_boot` 模块 + `vendor_dlkm` EROFS 分区）
          files: ${{ github.workspace }}/dist/*
