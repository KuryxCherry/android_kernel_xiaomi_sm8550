name: Sync Upstream Kernel

on:
  workflow_dispatch:
    inputs:
      upstream_source:
        description: "上游源选择"
        required: true
        default: "lineageos"
        type: choice
        options:
          - lineageos
          - ack-lts
      prefer_theirs_paths:
        description: "仅对指定冲突文件路径采纳上游版本（空格分隔，默认留空严格中止）"
        required: false
        default: ""
        type: string
      prefer_ours_paths:
        description: "仅对指定冲突文件路径保留本地版本（空格分隔，支持符号链接目录冲突，默认留空严格中止）"
        required: false
        default: ""
        type: string
      dry_run:
        description: "仅演练合并检测冲突，不推送"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Upstream (${{ inputs.upstream_source }})
    runs-on: ubuntu-24.04

    steps:
      - name: 检出当前分支完整历史
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 拉取并尝试无损合并上游
        env:
          UPSTREAM_SOURCE: ${{ inputs.upstream_source }}
          PREFER_THEIRS: ${{ inputs.prefer_theirs_paths }}
          PREFER_OURS: ${{ inputs.prefer_ours_paths }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          case "${UPSTREAM_SOURCE}" in
            lineageos)
              UPSTREAM_URL="https://github.com/LineageOS/android_kernel_xiaomi_sm8550.git"
              UPSTREAM_REF="lineage-24.0"
              ;;
            ack-lts)
              UPSTREAM_URL="https://android.googlesource.com/kernel/common"
              UPSTREAM_REF="android13-5.15-lts"
              ;;
          esac

          git remote add upstream "${UPSTREAM_URL}"
          git fetch --no-tags upstream "${UPSTREAM_REF}"

          BEHIND=$(git rev-list --count HEAD..upstream/"${UPSTREAM_REF}")
          echo "Commits available from ${UPSTREAM_URL} (${UPSTREAM_REF}): ${BEHIND}"
          if [ "${BEHIND}" = "0" ]; then
            {
              echo "## Upstream Kernel Sync Summary"
              echo "- **Source**: \`${UPSTREAM_SOURCE}\` (\`${UPSTREAM_REF}\`)"
              echo "- **Status**: Already up to date (0 commits behind)"
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          RESOLVED=()
          if ! git merge --no-edit --no-ff "upstream/${UPSTREAM_REF}"; then
            if [ -n "${PREFER_THEIRS}" ]; then
              read -r -a PATH_LIST <<< "${PREFER_THEIRS}"
              for P in "${PATH_LIST[@]}"; do
                if git diff --name-only --diff-filter=U | grep -qxF "${P}"; then
                  echo "[RESOLVE] Taking upstream version for whitelisted conflict: ${P}"
                  git checkout --theirs -- "${P}"
                  git add "${P}"
                  RESOLVED+=("theirs:${P}")
                fi
              done
            fi

            if [ -n "${PREFER_OURS}" ]; then
              read -r -a PATH_LIST <<< "${PREFER_OURS}"
              for P in "${PATH_LIST[@]}"; do
                HEAD_MODE=$(git ls-tree HEAD -- "${P}" | awk '{print $1}')
                if [ "${HEAD_MODE}" = "120000" ]; then
                  SUBS=$(git ls-files -u -- "${P}/" | awk '{print $4}' | sort -u || true)
                  if [ -n "${SUBS}" ] || git diff --name-only --diff-filter=U | grep -qxF "${P}"; then
                    echo "[RESOLVE] Preserving HEAD symlink for whitelisted file/dir conflict: ${P}"
                    while IFS= read -r sub; do
                      [ -n "${sub}" ] && git rm -rf --ignore-unmatch -- "${sub}"
                    done <<< "${SUBS}"
                    git rm -rf --ignore-unmatch -- "${P}~HEAD"
                    rm -rf -- "${P}" "${P}~HEAD"
                    git checkout HEAD -- "${P}"
                    git add "${P}"
                    RESOLVED+=("ours-symlink:${P}")
                  fi
                elif git diff --name-only --diff-filter=U | grep -qxF "${P}"; then
                  echo "[RESOLVE] Keeping HEAD version for whitelisted conflict: ${P}"
                  git checkout --ours -- "${P}"
                  git add "${P}"
                  RESOLVED+=("ours:${P}")
                fi
              done
            fi

            REMAINING=$(git diff --name-only --diff-filter=U || true)
            if [ -n "${REMAINING}" ]; then
              echo "=== UNRESOLVED MERGE CONFLICTS DETECTED (aborted safely; local commits untouched) ==="
              echo "${REMAINING}"
              {
                echo "## Upstream Kernel Sync Failed (Conflicts)"
                echo "- **Source**: \`${UPSTREAM_SOURCE}\` (\`${UPSTREAM_REF}\`)"
                echo "- **Incoming commits**: \`${BEHIND}\`"
                echo ""
                echo "### Unresolved conflicts"
                echo '```text'
                echo "${REMAINING}"
                echo '```'
              } >> "${GITHUB_STEP_SUMMARY}"
              git merge --abort || git reset --hard HEAD
              exit 1
            fi

            git commit --no-edit
          fi

          KVER_LINE=$(awk '/^(VERSION|PATCHLEVEL|SUBLEVEL) =/{printf "%s.", $3}' Makefile | sed 's/\.$//')
          {
            echo "## Upstream Kernel Sync Summary"
            echo "- **Source**: \`${UPSTREAM_SOURCE}\` (\`${UPSTREAM_REF}\`)"
            echo "- **Merged commits**: \`${BEHIND}\`"
            echo "- **Kernel version**: \`${KVER_LINE}\`"
            echo "- **Whitelisted resolutions**: \`${RESOLVED[*]:-none}\`"
            echo "- **Dry-run**: \`${DRY_RUN}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

          echo "=== Clean merge succeeded! ==="
          head -n 5 Makefile
          git log -n 5 --oneline

          if [ "${DRY_RUN}" = "true" ]; then
            echo "Dry-run enabled; skipping push."
          else
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
