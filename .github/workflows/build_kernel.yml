name: Build Xiaomi SM8550 Kernel

on:
  workflow_dispatch:
    inputs:
      device:
        description: "目标设备（对应 arch/arm64/configs/vendor/<device>_GKI.config）"
        required: true
        default: "socrates"
        type: choice
        options:
          - socrates
          - fuxi
          - nuwa
          - vermeer
          - gki_only
      clang_toolchain:
        description: "AOSP Clang 工具链（r596125 = Clang 22.0.2，与你真机环境一致）"
        required: false
        default: "r596125"
        type: choice
        options:
          - r596125
          - r450784e
      ksu_variant:
        description: "Root 方案集成（源码默认不含 KernelSU）"
        required: false
        default: "none"
        type: choice
        options:
          - none
          - kernelsu-next
          - kernelsu
      enable_lto:
        description: "Clang LTO 模式（默认 full + 极限防失联保护；想更快可选 thin）"
        required: false
        default: "full"
        type: choice
        options:
          - full
          - thin
          - none
      disable_debug_info:
        description: "关闭 DEBUG_INFO/BTF（默认保留完整 BTF；若极限模式仍 OOM 再勾选此项）"
        required: false
        default: false
        type: boolean
      build_modules:
        description: "同时编译内核模块（单刷 AnyKernel3 仅需 Image，关闭可提速并降内存）"
        required: false
        default: false
        type: boolean
      build_dtbs:
        description: "同时编译设备树（单刷 AnyKernel3 仅需 Image，建议保持关闭）"
        required: false
        default: false
        type: boolean
      package_anykernel3:
        description: "使用 AnyKernel3 打包可刷入 ZIP"
        required: false
        default: true
        type: boolean
      upload_release:
        description: "将构建产物发布到 GitHub Releases"
        required: false
        default: false
        type: boolean

  push:
    branches:
      - lineage-24.0
    tags:
      - "v*"
    paths-ignore:
      - "README*"
      - "Documentation/**"
      - ".github/**"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KERNEL_DIR: sm8550
  DT_DIR: sm8550-devicetrees
  MODULES_DIR: sm8550-modules
  OUT_DIR: out
  ANYKERNEL_REPO: https://github.com/osm0sis/AnyKernel3.git

jobs:
  build:
    name: Build SM8550 Kernel (${{ inputs.device || 'socrates' }} / ${{ inputs.clang_toolchain || 'r596125' }} / ${{ inputs.enable_lto || 'full' }})
    # Ubuntu 24.04 自带 dwarves (pahole 1.25)，与真机 CONFIG_PAHOLE_VERSION=125 对齐
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: 释放 Runner 磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: 配置 ZRAM 压缩内存 + 24GB 磁盘 Swap（Full LTO 极限防 OOM 与防失联）
        if: ${{ (inputs.enable_lto || 'full') == 'full' }}
        run: |
          # 1. 优先尝试开启 16GB ZRAM (ZSTD/LZ4，高优先级 pri=100)，对 LLVM IR/DWARF 压缩比高且远快于磁盘
          if sudo modprobe zram 2>/dev/null; then
            ZRAM_DEV=$(sudo zramctl --find --size 16G --algorithm zstd 2>/dev/null || sudo zramctl --find --size 16G --algorithm lz4 2>/dev/null || true)
            if [ -n "${ZRAM_DEV}" ]; then
              sudo mkswap "${ZRAM_DEV}"
              sudo swapon -p 100 "${ZRAM_DEV}"
              echo "Enabled ZRAM swap on ${ZRAM_DEV} (priority 100)"
            fi
          else
            echo "ZRAM kernel module unavailable on this runner, falling back to disk swap only."
          fi

          # 2. 挂载 24GB 磁盘 Swap (低优先级 pri=10) 作为最终兜底，优先放在独立临时盘 /mnt
          MNT_AVAIL_GB=$(df -BG --output=avail /mnt 2>/dev/null | tail -1 | tr -dc '0-9' || echo 0)
          if [ "${MNT_AVAIL_GB:-0}" -ge 28 ]; then
            SWAP_PATH="/mnt/swapfile"
          else
            SWAP_PATH="/swapfile"
          fi
          echo "Creating 24GB disk swap at ${SWAP_PATH} (/mnt avail: ${MNT_AVAIL_GB}G)"
          sudo fallocate -l 24G "${SWAP_PATH}"
          sudo chmod 600 "${SWAP_PATH}"
          sudo mkswap "${SWAP_PATH}"
          sudo swapon -p 10 "${SWAP_PATH}"

          # 降低 Swap 预读抖动，优先回收不活跃页
          sudo sysctl -w vm.swappiness=100 vm.page-cluster=0
          swapon --show
          free -h

      - name: 安装编译依赖（含 pahole 1.25）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl device-tree-compiler \
            dwarves flex git kmod libelf-dev libncurses-dev libssl-dev \
            lz4 python3 rsync tar unzip wget xz-utils zip zstd
          pahole --version

      - name: 拉取内核源码
        uses: actions/checkout@v4
        with:
          path: ${{ env.KERNEL_DIR }}
          fetch-depth: 1

      - name: 拉取配套设备树仓库（sm8550-devicetrees，仅开启 build_dtbs 时）
        if: ${{ inputs.build_dtbs == true }}
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_xiaomi_sm8550-devicetrees
          ref: lineage-24.0
          path: ${{ env.DT_DIR }}
          fetch-depth: 1

      - name: 拉取外部模块仓库以补齐设备树头文件（sm8550-modules，仅开启 build_dtbs 时）
        if: ${{ inputs.build_dtbs == true }}
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_xiaomi_sm8550-modules
          ref: lineage-24.0
          path: ${{ env.MODULES_DIR }}
          fetch-depth: 1

      - name: 校验设备树软链接并同步 vendor dt-bindings 头文件
        if: ${{ inputs.build_dtbs == true }}
        run: |
          ls -la "${{ env.KERNEL_DIR }}/arch/arm64/boot/dts/vendor"
          test -d "${{ env.KERNEL_DIR }}/arch/arm64/boot/dts/vendor"
          mkdir -p "${{ env.KERNEL_DIR }}/scripts/dtc/include-prefixes/bindings"
          mkdir -p "${{ env.KERNEL_DIR }}/scripts/dtc/include-prefixes/dt-bindings"
          find "${{ env.MODULES_DIR }}" -type d -name "bindings" -exec sh -c 'cp -rn "$1"/* "$2"/ 2>/dev/null || true' _ {} "${{ env.KERNEL_DIR }}/scripts/dtc/include-prefixes/bindings" \;
          find "${{ env.MODULES_DIR }}" -type d -name "dt-bindings" -exec sh -c 'cp -rn "$1"/* "$2"/ 2>/dev/null || true' _ {} "${{ env.KERNEL_DIR }}/scripts/dtc/include-prefixes/dt-bindings" \;

      - name: 解析构建参数与 Clang 版本
        id: meta
        run: |
          DEVICE="${{ inputs.device || 'socrates' }}"
          CLANG_VERSION="${{ inputs.clang_toolchain || 'r596125' }}"
          KSU_VARIANT="${{ inputs.ksu_variant || 'none' }}"
          LTO_MODE="${{ inputs.enable_lto || 'full' }}"
          DISABLE_DEBUG_INFO="${{ inputs.disable_debug_info == true && 'true' || 'false' }}"
          BUILD_MODULES="${{ inputs.build_modules == true && 'true' || 'false' }}"
          BUILD_DTBS="${{ inputs.build_dtbs == true && 'true' || 'false' }}"
          PACKAGE_AK3="${{ inputs.package_anykernel3 != false && 'true' || 'false' }}"

          if [ "${CLANG_VERSION}" = "r596125" ]; then
            CLANG_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/mirror-goog-main-llvm-toolchain-source/clang-r596125.tar.gz"
          else
            CLANG_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android14-release/clang-${CLANG_VERSION}.tar.gz"
          fi

          SHORT_SHA=$(git -C "${{ env.KERNEL_DIR }}" rev-parse --short HEAD)
          BUILD_DATE=$(date +%Y%m%d-%H%M)

          {
            echo "device=${DEVICE}"
            echo "ksu_variant=${KSU_VARIANT}"
            echo "lto_mode=${LTO_MODE}"
            echo "disable_debug_info=${DISABLE_DEBUG_INFO}"
            echo "build_modules=${BUILD_MODULES}"
            echo "build_dtbs=${BUILD_DTBS}"
            echo "package_ak3=${PACKAGE_AK3}"
            echo "clang_version=${CLANG_VERSION}"
            echo "clang_url=${CLANG_URL}"
            echo "short_sha=${SHORT_SHA}"
            echo "build_date=${BUILD_DATE}"
          } >> "$GITHUB_OUTPUT"

          echo "Device=${DEVICE} | Clang=${CLANG_VERSION} | LTO=${LTO_MODE} | NoDebugInfo=${DISABLE_DEBUG_INFO} | KSU=${KSU_VARIANT} | Commit=${SHORT_SHA}"

      - name: 集成 KernelSU / KernelSU-Next（可选）
        if: ${{ steps.meta.outputs.ksu_variant != 'none' }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          case "${{ steps.meta.outputs.ksu_variant }}" in
            kernelsu-next)
              curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -
              ;;
            kernelsu)
              curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
              ;;
          esac

      - name: 缓存 AOSP Clang 工具链
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/toolchain/clang
          key: aosp-clang-${{ steps.meta.outputs.clang_version }}

      - name: 下载 AOSP Clang 工具链
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${{ github.workspace }}/toolchain/clang"
          echo "Downloading Clang from: ${{ steps.meta.outputs.clang_url }}"
          curl -fSL "${{ steps.meta.outputs.clang_url }}" | tar -xz -C "${{ github.workspace }}/toolchain/clang"

      - name: 校验 Clang 与 LLD 版本
        run: |
          export PATH="${{ github.workspace }}/toolchain/clang/bin:${PATH}"
          clang --version
          ld.lld --version

      - name: 缓存 ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-sm8550-${{ steps.meta.outputs.clang_version }}-${{ steps.meta.outputs.device }}-${{ steps.meta.outputs.ksu_variant }}-${{ github.sha }}
          restore-keys: |
            ccache-sm8550-${{ steps.meta.outputs.clang_version }}-${{ steps.meta.outputs.device }}-${{ steps.meta.outputs.ksu_variant }}-
            ccache-sm8550-${{ steps.meta.outputs.clang_version }}-${{ steps.meta.outputs.device }}-
            ccache-sm8550-${{ steps.meta.outputs.clang_version }}-

      - name: 配置内核（defconfig 合并与 LTO 选项）
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          export PATH="${{ github.workspace }}/toolchain/clang/bin:${PATH}"
          export KBUILD_BUILD_USER="github-actions"
          export KBUILD_BUILD_HOST="sm8550-ci"

          MAKE_ARGS=(
            O="${{ env.OUT_DIR }}"
            ARCH=arm64
            SUBARCH=arm64
            CC="ccache clang"
            HOSTCC=clang
            HOSTCXX=clang++
            LLVM=1
            LLVM_IAS=1
            DEPMOD=depmod
            DTC_EXT="$(command -v dtc)"
          )

          CONFIG_FRAGMENTS=(gki_defconfig vendor/kalama_GKI.config)
          if [ "${{ steps.meta.outputs.device }}" != "gki_only" ]; then
            DEVICE_CFG="vendor/${{ steps.meta.outputs.device }}_GKI.config"
            test -f "arch/arm64/configs/${DEVICE_CFG}"
            CONFIG_FRAGMENTS+=("${DEVICE_CFG}")
          fi

          echo "Merging configs: ${CONFIG_FRAGMENTS[*]}"
          make -j"$(nproc)" "${MAKE_ARGS[@]}" "${CONFIG_FRAGMENTS[@]}"

          case "${{ steps.meta.outputs.lto_mode }}" in
            full)
              ./scripts/config --file "${{ env.OUT_DIR }}/.config" \
                -d LTO_NONE -d LTO_CLANG_THIN -e LTO_CLANG_FULL
              ;;
            thin)
              ./scripts/config --file "${{ env.OUT_DIR }}/.config" \
                -d LTO_NONE -d LTO_CLANG_FULL -e LTO_CLANG_THIN
              ;;
            none)
              ./scripts/config --file "${{ env.OUT_DIR }}/.config" \
                -d LTO_CLANG_THIN -d LTO_CLANG_FULL -e LTO_NONE
              ;;
          esac

          if [ "${{ steps.meta.outputs.disable_debug_info }}" = "true" ]; then
            echo "Disabling DEBUG_INFO and DEBUG_INFO_BTF to minimize Full LTO memory usage"
            ./scripts/config --file "${{ env.OUT_DIR }}/.config" \
              -d DEBUG_INFO -d DEBUG_INFO_DWARF4 -d DEBUG_INFO_DWARF5 \
              -d DEBUG_INFO_BTF -d DEBUG_INFO_BTF_MODULES
          fi

          if [ "${{ steps.meta.outputs.ksu_variant }}" != "none" ]; then
            ./scripts/config --file "${{ env.OUT_DIR }}/.config" -e KSU -e KPROBES -e OVERLAY_FS
          fi

          make -j"$(nproc)" "${MAKE_ARGS[@]}" olddefconfig

      - name: 编译内核镜像（含内存监控与低优先级限流保护）
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          export PATH="${{ github.workspace }}/toolchain/clang/bin:${PATH}"
          export KBUILD_BUILD_USER="github-actions"
          export KBUILD_BUILD_HOST="sm8550-ci"
          ccache -M 4G
          ccache -z

          MAKE_ARGS=(
            O="${{ env.OUT_DIR }}"
            ARCH=arm64
            SUBARCH=arm64
            CC="ccache clang"
            HOSTCC=clang
            HOSTCXX=clang++
            LLVM=1
            LLVM_IAS=1
            DEPMOD=depmod
            DTC_EXT="$(command -v dtc)"
          )

          JOBS="$(nproc)"
          if [ "${{ steps.meta.outputs.lto_mode }}" = "full" ]; then
            # Full LTO 极限保护：降编译并发为 2，且通过包装器强制 ld.lld 单线程链接以压低峰值内存
            JOBS=2
            cat <<EOF > /tmp/ld.lld-1t
          #!/usr/bin/env bash
          exec "${{ github.workspace }}/toolchain/clang/bin/ld.lld" --threads=1 "\$@"
          EOF
            chmod +x /tmp/ld.lld-1t
            MAKE_ARGS+=(LD="/tmp/ld.lld-1t")
          fi

          # 在同一步骤内启动轻量内存/Swap 实时监控，便于定位峰值占用，退出时自动清理
          (
            while true; do
              sleep 60
              echo "[MEM-MON $(date -u +%H:%M:%S)] $(free -h | awk '/Mem:/{printf "RAM %s/%s (avail %s)", $3,$2,$7} /Swap:/{printf " | Swap %s/%s", $3,$2}')"
              ps -eo comm,rss --sort=-rss | head -n 4 | awk 'NR>1{printf "  top: %s %.1fGB\n", $1, $2/1048576}'
            done
          ) &
          MON_PID=$!
          trap 'kill "${MON_PID}" 2>/dev/null || true' EXIT

          # 使用 ionice -c 3 (空闲级 I/O) + nice -n 19 (最低 CPU 优先级)，彻底避免拖死 Runner 心跳进程
          ionice -c 3 nice -n 19 make -j"${JOBS}" "${MAKE_ARGS[@]}" Image

          if [ "${{ steps.meta.outputs.build_modules }}" = "true" ]; then
            ionice -c 3 nice -n 19 make -j"${JOBS}" "${MAKE_ARGS[@]}" modules
          fi

          if [ "${{ steps.meta.outputs.build_dtbs }}" = "true" ]; then
            ionice -c 3 nice -n 19 make -j"${JOBS}" "${MAKE_ARGS[@]}" dtbs
          fi

          ccache -s

      - name: 收集构建产物并打包 AnyKernel3
        id: package
        run: |
          DIST_DIR="${{ github.workspace }}/dist"
          BOOT_OUT="${{ github.workspace }}/${{ env.KERNEL_DIR }}/${{ env.OUT_DIR }}/arch/arm64/boot"
          mkdir -p "${DIST_DIR}"

          cp "${BOOT_OUT}/Image" "${DIST_DIR}/Image"
          cp "${{ github.workspace }}/${{ env.KERNEL_DIR }}/${{ env.OUT_DIR }}/.config" "${DIST_DIR}/defconfig_used"

          KERNEL_VER=$(cat "${{ github.workspace }}/${{ env.KERNEL_DIR }}/${{ env.OUT_DIR }}/include/config/kernel.release" 2>/dev/null || echo "5.15-sm8550")
          echo "kernel_release=${KERNEL_VER}" >> "$GITHUB_OUTPUT"

          if [ "${{ steps.meta.outputs.build_dtbs }}" = "true" ] && [ -d "${BOOT_OUT}/dts" ]; then
            find "${BOOT_OUT}/dts" -name '*.dtb' -exec cat {} + > "${DIST_DIR}/dtb" || true
            if [ ! -s "${DIST_DIR}/dtb" ]; then
              rm -f "${DIST_DIR}/dtb"
            fi
          fi

          if [ "${{ steps.meta.outputs.package_ak3 }}" = "true" ]; then
            git clone --depth=1 "${{ env.ANYKERNEL_REPO }}" "${{ github.workspace }}/AnyKernel3"
            cd "${{ github.workspace }}/AnyKernel3"
            rm -rf .git README.md
            cp "${DIST_DIR}/Image" ./Image
            if [ -f "${DIST_DIR}/dtb" ]; then
              cp "${DIST_DIR}/dtb" ./dtb
            fi

            sed -i 's/do\.devicecheck=1/do.devicecheck=0/g' anykernel.sh
            sed -i 's|block=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;|block=auto;|g' anykernel.sh
            sed -i 's/is_slot_device=0;/is_slot_device=1;/g' anykernel.sh

            KSU_TAG=""
            if [ "${{ steps.meta.outputs.ksu_variant }}" != "none" ]; then
              KSU_TAG="-${{ steps.meta.outputs.ksu_variant }}"
            fi

            ZIP_NAME="AnyKernel3-sm8550-${{ steps.meta.outputs.device }}-${{ steps.meta.outputs.clang_version }}-${{ steps.meta.outputs.lto_mode }}${KSU_TAG}-${{ steps.meta.outputs.build_date }}-${{ steps.meta.outputs.short_sha }}.zip"
            zip -r9 "${DIST_DIR}/${ZIP_NAME}" ./* -x "*.zip"
            echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"
          fi

          ls -lh "${DIST_DIR}"

      - name: 上传构建产物（Artifact）
        uses: actions/upload-artifact@v4
        with:
          name: kernel-sm8550-${{ steps.meta.outputs.device }}-${{ steps.meta.outputs.clang_version }}-${{ steps.meta.outputs.lto_mode }}-${{ steps.meta.outputs.ksu_variant }}-${{ steps.meta.outputs.short_sha }}
          path: ${{ github.workspace }}/dist/*
          retention-days: 14

      - name: 发布 GitHub Release（可选）
        if: startsWith(github.ref, 'refs/tags/') || inputs.upload_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}-{1}', steps.meta.outputs.device, steps.meta.outputs.build_date) }}
          name: "Xiaomi SM8550 Kernel (${{ steps.meta.outputs.device }}) - ${{ steps.package.outputs.kernel_release }}"
          body: |
            - **设备配置**: `${{ steps.meta.outputs.device }}`
            - **内核版本**: `${{ steps.package.outputs.kernel_release }}`
            - **Clang 版本**: `${{ steps.meta.outputs.clang_version }}`
            - **LTO 模式**: `${{ steps.meta.outputs.lto_mode }}`
            - **关闭 DEBUG_INFO**: `${{ steps.meta.outputs.disable_debug_info }}`
            - **KernelSU 方案**: `${{ steps.meta.outputs.ksu_variant }}`
            - **源码提交**: `${{ github.sha }}`
          files: ${{ github.workspace }}/dist/*
