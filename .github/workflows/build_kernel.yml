name: Build Xiaomi SM8550 Kernel

on:
  workflow_dispatch:
    inputs:
      device:
        description: "目标设备"
        required: true
        default: "socrates"
        type: choice
        options:
          - socrates
          - fuxi
          - nuwa
          - vermeer
      enable_lto:
        description: "Clang LTO 模式（thin 稳快；full 会自动开 ZRAM/Swap 保护）"
        required: false
        default: "thin"
        type: choice
        options:
          - thin
          - full
          - none
      ksu_variant:
        description: "Root 方案（可选）"
        required: false
        default: "none"
        type: choice
        options:
          - none
          - kernelsu-next
          - kernelsu
      disable_debug_info:
        description: "关闭 DEBUG_INFO/BTF（仅在 full LTO 内存不足时勾选）"
        required: false
        default: false
        type: boolean
      upload_release:
        description: "发布产物到 GitHub Releases"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KERNEL_DIR: sm8550
  OUT_DIR: out
  CLANG_VERSION: r596125
  CLANG_URL: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/mirror-goog-main-llvm-toolchain-source/clang-r596125.tar.gz
  ANYKERNEL_REPO: https://github.com/osm0sis/AnyKernel3.git

jobs:
  build:
    name: Build SM8550 (${{ inputs.device || 'socrates' }} / ${{ inputs.enable_lto || 'thin' }})
    # Ubuntu 24.04 自带 pahole 1.25 + Clang 22.0.2 (r596125)，与 LineageOS 24.0 真机环境一致
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: 释放 Runner 磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: 配置 ZRAM + 24GB Swap（仅 Full LTO 启用）
        if: ${{ (inputs.enable_lto || 'thin') == 'full' }}
        run: |
          if sudo modprobe zram 2>/dev/null; then
            ZRAM_DEV=$(sudo zramctl --find --size 16G --algorithm zstd 2>/dev/null || sudo zramctl --find --size 16G --algorithm lz4 2>/dev/null || true)
            if [ -n "${ZRAM_DEV}" ]; then
              sudo mkswap "${ZRAM_DEV}"
              sudo swapon -p 100 "${ZRAM_DEV}"
            fi
          fi

          MNT_AVAIL_GB=$(df -BG --output=avail /mnt 2>/dev/null | tail -1 | tr -dc '0-9' || echo 0)
          SWAP_PATH=$([ "${MNT_AVAIL_GB:-0}" -ge 28 ] && echo "/mnt/swapfile" || echo "/swapfile")
          sudo fallocate -l 24G "${SWAP_PATH}"
          sudo chmod 600 "${SWAP_PATH}"
          sudo mkswap "${SWAP_PATH}"
          sudo swapon -p 10 "${SWAP_PATH}"
          sudo sysctl -w vm.swappiness=100 vm.page-cluster=0
          free -h

      - name: 安装编译依赖（含 pahole 1.25）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl device-tree-compiler \
            dwarves flex git kmod libelf-dev libncurses-dev libssl-dev \
            lz4 python3 rsync tar unzip wget xz-utils zip zstd
          pahole --version

      - name: 拉取本仓库内核源码
        uses: actions/checkout@v4
        with:
          path: ${{ env.KERNEL_DIR }}
          fetch-depth: 1

      - name: 解析构建参数
        id: meta
        run: |
          DEVICE="${{ inputs.device || 'socrates' }}"
          LTO_MODE="${{ inputs.enable_lto || 'thin' }}"
          KSU_VARIANT="${{ inputs.ksu_variant || 'none' }}"
          DISABLE_DEBUG_INFO="${{ inputs.disable_debug_info == true && 'true' || 'false' }}"
          SHORT_SHA=$(git -C "${{ env.KERNEL_DIR }}" rev-parse --short HEAD)
          BUILD_DATE=$(date +%Y%m%d-%H%M)

          {
            echo "device=${DEVICE}"
            echo "lto_mode=${LTO_MODE}"
            echo "ksu_variant=${KSU_VARIANT}"
            echo "disable_debug_info=${DISABLE_DEBUG_INFO}"
            echo "short_sha=${SHORT_SHA}"
            echo "build_date=${BUILD_DATE}"
          } >> "$GITHUB_OUTPUT"

      - name: 集成 KernelSU / KernelSU-Next（可选）
        if: ${{ steps.meta.outputs.ksu_variant != 'none' }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          case "${{ steps.meta.outputs.ksu_variant }}" in
            kernelsu-next)
              curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -
              ;;
            kernelsu)
              curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
              ;;
          esac

      - name: 缓存 AOSP Clang 22.0.2 (r596125)
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/toolchain/clang
          key: aosp-clang-${{ env.CLANG_VERSION }}

      - name: 下载 AOSP Clang 22.0.2 (r596125)
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${{ github.workspace }}/toolchain/clang"
          curl -fSL "${{ env.CLANG_URL }}" | tar -xz -C "${{ github.workspace }}/toolchain/clang"

      - name: 缓存 ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-sm8550-${{ env.CLANG_VERSION }}-${{ steps.meta.outputs.device }}-${{ steps.meta.outputs.ksu_variant }}-${{ github.sha }}
          restore-keys: |
            ccache-sm8550-${{ env.CLANG_VERSION }}-${{ steps.meta.outputs.device }}-${{ steps.meta.outputs.ksu_variant }}-
            ccache-sm8550-${{ env.CLANG_VERSION }}-${{ steps.meta.outputs.device }}-
            ccache-sm8550-${{ env.CLANG_VERSION }}-

      - name: 配置并编译内核 Image
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          export PATH="${{ github.workspace }}/toolchain/clang/bin:${PATH}"
          export KBUILD_BUILD_USER="github-actions"
          export KBUILD_BUILD_HOST="sm8550-ci"
          clang --version
          ccache -M 4G
          ccache -z

          MAKE_ARGS=(
            O="${{ env.OUT_DIR }}"
            ARCH=arm64
            SUBARCH=arm64
            CC="ccache clang"
            HOSTCC=clang
            HOSTCXX=clang++
            LLVM=1
            LLVM_IAS=1
            DEPMOD=depmod
            DTC_EXT="$(command -v dtc)"
          )

          make -j"$(nproc)" "${MAKE_ARGS[@]}" gki_defconfig vendor/kalama_GKI.config "vendor/${{ steps.meta.outputs.device }}_GKI.config"

          case "${{ steps.meta.outputs.lto_mode }}" in
            full) ./scripts/config --file "${{ env.OUT_DIR }}/.config" -d LTO_NONE -d LTO_CLANG_THIN -e LTO_CLANG_FULL ;;
            thin) ./scripts/config --file "${{ env.OUT_DIR }}/.config" -d LTO_NONE -d LTO_CLANG_FULL -e LTO_CLANG_THIN ;;
            none) ./scripts/config --file "${{ env.OUT_DIR }}/.config" -d LTO_CLANG_THIN -d LTO_CLANG_FULL -e LTO_NONE ;;
          esac

          if [ "${{ steps.meta.outputs.disable_debug_info }}" = "true" ]; then
            ./scripts/config --file "${{ env.OUT_DIR }}/.config" \
              -d DEBUG_INFO -d DEBUG_INFO_DWARF4 -d DEBUG_INFO_DWARF5 \
              -d DEBUG_INFO_BTF -d DEBUG_INFO_BTF_MODULES
          fi

          if [ "${{ steps.meta.outputs.ksu_variant }}" != "none" ]; then
            ./scripts/config --file "${{ env.OUT_DIR }}/.config" -e KSU -e KPROBES -e OVERLAY_FS
          fi

          make -j"$(nproc)" "${MAKE_ARGS[@]}" olddefconfig
          grep -E '^(CONFIG_TCP_CONG_BBR3|CONFIG_DEFAULT_TCP_CONG|CONFIG_NET_SCH_DEFAULT|CONFIG_DEFAULT_FQ|CONFIG_DEFAULT_NET_SCH|CONFIG_LRU_GEN_ENABLED|CONFIG_RCU_LAZY|CONFIG_LTO_CLANG|# CONFIG_RCU_LAZY_DEFAULT_OFF)' "${{ env.OUT_DIR }}/.config" || true

          JOBS="$(nproc)"
          if [ "${{ steps.meta.outputs.lto_mode }}" = "full" ]; then
            JOBS=2
            cat <<EOF > /tmp/ld.lld-1t
          #!/usr/bin/env bash
          exec "${{ github.workspace }}/toolchain/clang/bin/ld.lld" --threads=1 "\$@"
          EOF
            chmod +x /tmp/ld.lld-1t
            MAKE_ARGS+=(LD="/tmp/ld.lld-1t")
          fi

          (
            while true; do
              sleep 60
              echo "[MEM-MON $(date -u +%H:%M:%S)] $(free -h | awk '/Mem:/{printf "RAM %s/%s (avail %s)", $3,$2,$7} /Swap:/{printf " | Swap %s/%s", $3,$2}')"
            done
          ) &
          MON_PID=$!
          trap 'kill "${MON_PID}" 2>/dev/null || true' EXIT

          ionice -c 3 nice -n 19 make -j"${JOBS}" "${MAKE_ARGS[@]}" Image
          ccache -s

      - name: 打包 AnyKernel3 刷入包
        id: package
        run: |
          DIST_DIR="${{ github.workspace }}/dist"
          OUT_ABS="${{ github.workspace }}/${{ env.KERNEL_DIR }}/${{ env.OUT_DIR }}"
          mkdir -p "${DIST_DIR}"

          cp "${OUT_ABS}/arch/arm64/boot/Image" "${DIST_DIR}/Image"
          cp "${OUT_ABS}/.config" "${DIST_DIR}/defconfig_used"

          KERNEL_VER=$(cat "${OUT_ABS}/include/config/kernel.release" 2>/dev/null || echo "5.15-sm8550")
          echo "kernel_release=${KERNEL_VER}" >> "$GITHUB_OUTPUT"

          git clone --depth=1 "${{ env.ANYKERNEL_REPO }}" "${{ github.workspace }}/AnyKernel3"
          cd "${{ github.workspace }}/AnyKernel3"
          rm -rf .git README.md
          cp "${DIST_DIR}/Image" ./Image

          cat <<EOF > anykernel.sh
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers

          ### AnyKernel setup
          properties() { '
          kernel.string=Xiaomi SM8550 Kernel (${{ steps.meta.outputs.device }}) - ${KERNEL_VER}
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=${{ steps.meta.outputs.device }}
          device.name2=
          device.name3=
          device.name4=
          device.name5=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; } # end properties

          ### AnyKernel install
          BLOCK=boot;
          IS_SLOT_DEVICE=1;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          # GKI boot partition has no ramdisk (ramdisk lives in init_boot)
          split_boot;
          flash_boot;
          EOF
          chmod 644 anykernel.sh

          KSU_TAG=$([ "${{ steps.meta.outputs.ksu_variant }}" != "none" ] && echo "-${{ steps.meta.outputs.ksu_variant }}" || echo "")
          ZIP_NAME="AnyKernel3-sm8550-${{ steps.meta.outputs.device }}-${{ steps.meta.outputs.lto_mode }}${KSU_TAG}-${{ steps.meta.outputs.build_date }}-${{ steps.meta.outputs.short_sha }}.zip"
          zip -r9 "${DIST_DIR}/${ZIP_NAME}" ./* -x "*.zip"
          ls -lh "${DIST_DIR}"

      - name: 上传构建产物（Artifact）
        uses: actions/upload-artifact@v4
        with:
          name: kernel-sm8550-${{ steps.meta.outputs.device }}-${{ steps.meta.outputs.lto_mode }}-${{ steps.meta.outputs.ksu_variant }}-${{ steps.meta.outputs.short_sha }}
          path: ${{ github.workspace }}/dist/*
          retention-days: 14

      - name: 发布 GitHub Release（可选）
        if: startsWith(github.ref, 'refs/tags/') || inputs.upload_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}-{1}', steps.meta.outputs.device, steps.meta.outputs.build_date) }}
          name: "Xiaomi SM8550 Kernel (${{ steps.meta.outputs.device }}) - ${{ steps.package.outputs.kernel_release }}"
          body: |
            - **设备**: `${{ steps.meta.outputs.device }}`
            - **内核版本**: `${{ steps.package.outputs.kernel_release }}`
            - **工具链**: `AOSP Clang 22.0.2 (r596125)`
            - **LTO 模式**: `${{ steps.meta.outputs.lto_mode }}`
            - **KernelSU**: `${{ steps.meta.outputs.ksu_variant }}`
            - **源码提交**: `${{ github.sha }}`
          files: ${{ github.workspace }}/dist/*
