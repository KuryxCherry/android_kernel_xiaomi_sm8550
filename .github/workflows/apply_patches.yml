name: Apply Upstream Patches to Repo

on:
  workflow_dispatch:
    inputs:
      apply_bbrv3:
        description: "合入 TCP BBRv3 (android13-5.15-lts) 并自动更新 socrates 默认拥塞控制"
        required: false
        default: true
        type: boolean
      apply_f2fs_opt:
        description: "合入 F2FS 拥塞与 fsync 优化到本仓库源码"
        required: false
        default: true
        type: boolean
      apply_lz4_110:
        description: "合入 LZ4 1.10.0 + ARM64 NEON 汇编加速（跨版本通用，保留 KMI 符号）"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  apply:
    name: Patch & Commit to Branch
    runs-on: ubuntu-24.04

    steps:
      - name: 检出当前分支源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 安装依赖并配置 Git 身份
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends patch curl perl
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 合入 BBRv3、F2FS 调优与 LZ4 1.10.0（按功能独立提交）
        run: |
          mkdir -p /tmp/patches
          CHANGED=0

          apply_one() {
            local TITLE="$1"
            local URL="$2"
            local FILE="$3"

            curl -fSL -o "${FILE}" "${URL}"

            if patch -p1 --dry-run --reverse --force < "${FILE}" >/dev/null 2>&1; then
              echo "[SKIP] ${TITLE} 已存在于当前源码中，跳过。"
              return 0
            fi

            echo "[APPLY] 正在合入: ${TITLE}"
            patch -p1 --forward --fuzz=3 < "${FILE}"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "${TITLE}"
              CHANGED=1
            fi
          }

          if [ "${{ inputs.apply_bbrv3 }}" = "true" ]; then
            apply_one \
              "net: tcp: backport BBRv3 for android13-5.15-lts" \
              "https://raw.githubusercontent.com/WildKernels/kernel_patches/refs/heads/main/common/bbrv3/0001-net-tcp-backport-BBRv3-to-android13-5.15-lts.patch" \
              "/tmp/patches/bbrv3.patch"

            CFG="arch/arm64/configs/vendor/socrates_GKI.config"
            if grep -qE '^config TCP_CONG_BBR3\b' net/ipv4/Kconfig && [ -f "${CFG}" ]; then
              if ! grep -q '^CONFIG_TCP_CONG_BBR3=y' "${CFG}"; then
                sed -i '/^CONFIG_DEFAULT_BBR=y/d; /^CONFIG_DEFAULT_TCP_CONG=/d' "${CFG}"
                printf '\n# Enable BBRv3 as default TCP congestion control\nCONFIG_TCP_CONG_BBR3=y\nCONFIG_DEFAULT_BBR3=y\nCONFIG_DEFAULT_TCP_CONG="bbr3"\n' >> "${CFG}"
                if grep -qE '^config TCP_PLB\b' net/ipv4/Kconfig; then
                  echo "CONFIG_TCP_PLB=y" >> "${CFG}"
                fi
                git add "${CFG}"
                if ! git diff --cached --quiet; then
                  git commit -m "arm64: configs: socrates: set BBRv3 as default TCP congestion control"
                  CHANGED=1
                fi
              fi
            fi
          fi

          if [ "${{ inputs.apply_f2fs_opt }}" = "true" ]; then
            apply_one \
              "fs: f2fs: reduce congestion stalls" \
              "https://raw.githubusercontent.com/WildKernels/kernel_patches/refs/heads/main/common/f2fs_reduce_congestion.patch" \
              "/tmp/patches/f2fs_reduce_congestion.patch"

            apply_one \
              "fs: f2fs: enlarge min fsync blocks" \
              "https://raw.githubusercontent.com/WildKernels/kernel_patches/refs/heads/main/common/f2fs_enlarge_min_fsync_blocks.patch" \
              "/tmp/patches/f2fs_enlarge_min_fsync_blocks.patch"
          fi

          if [ "${{ inputs.apply_lz4_110 }}" = "true" ]; then
            if [ -d "lib/lz4/lz4armv8" ]; then
              echo "[SKIP] LZ4 1.10.0 + ARM64 NEON 已存在于当前源码中，跳过。"
            else
              echo "[APPLY] 正在稀疏拉取并合入 LZ4 1.10.0 + ARM64 NEON 汇编加速"
              rm -rf /tmp/abk_zram
              git clone --depth=1 --filter=blob:none --sparse -b dev \
                https://github.com/N1-k0-la1/AnyBaseKernel.git /tmp/abk_zram
              git -C /tmp/abk_zram sparse-checkout set zram

              rm -f lib/lz4/lz4_compress.c lib/lz4/lz4_decompress.c lib/lz4/lz4defs.h lib/lz4/lz4hc_compress.c
              cp -r /tmp/abk_zram/zram/lz4/* lib/lz4/
              cp -r /tmp/abk_zram/zram/include/linux/* include/linux/
              bash /tmp/abk_zram/zram/apply_lz4_neon.sh

              git add -A
              if ! git diff --cached --quiet; then
                git commit -m "lib/lz4: upgrade to LZ4 1.10.0 with ARM64 NEON acceleration"
                CHANGED=1
              fi
            fi
          fi

          if [ "${CHANGED}" = "1" ]; then
            echo "=== 推送新提交回仓库分支 ${GITHUB_REF_NAME} ==="
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "=== 没有需要提交的新改动 ==="
          fi
